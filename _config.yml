# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Yohan Chatelain
author:
  name: Yohan Chatelain
  email: yohan.chatelain@gmail.com

avatar: https://avatars.githubusercontent.com/yohanchatelain
header: https://avatars.githubusercontent.com/yohanchatelain
description: >-
  Research and scientific software by Yohan Chatelain on numerical reliability,
  floating-point arithmetic, high-performance computing, and reproducible AI and neuroimaging.

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://yohanchatelain.github.io" # the base hostname & protocol for your site
# Date-only front matter is serialized at midnight in this zone; UTC matches GitHub Pages.
timezone: UTC
github_username:  yohanchatelain
linkedin_username: yohan-chatelain

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-avatar
  - jemoji
  - github-pages
  - jekyll-seo-tag
  - jekyll-sitemap

minima:
  skin: classic
  social_links:
    - { platform: github,  user_url: "https://github.com/yohanchatelain" }
    - { platform: linkedin, user_url: "https://www.linkedin.com/in/yohan-chatelain/" }
    - { platform: google_scholar, user_url: "https://scholar.google.ca/citations?user=fYcLg4IAAAAJ&hl=en" }

google_analytics: G-PP69GHJBB5
show_excerpts: true

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Keep utility files and content subpages out of the primary navigation.
header_pages:
  - 00_index.markdown
  - 01_about.md
  - 02_projects.md
  - 03_research.md
  - 04_cv.md
  - 05_contact.md

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs
  - scripts
  - README.md
  - requirements-validation.txt

defaults:
  - scope:
      path: ""
      type: posts
    values:
      author: Yohan Chatelain
