name: Update Citeometer snapshot

# NASA ADS reads and bioRxiv downloads can't be fetched from the browser (no CORS),
# so collect them server-side once a day for the badges on the research page.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes github:yohanchatelain/citeometer#v1.2.0 --input 02_projects.md 03_research.md software _posts --output assets/citeometer-snapshot.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}  # optional; avoids Semantic Scholar throttling
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/citeometer-snapshot.json
          git diff --staged --quiet || (git commit -m "Update Citeometer snapshot" && git push)
